
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvish MLBB Skin Checker</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b14;color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:22px 18px;background:#111426;
 border-bottom:1px solid #292d45;
 display:flex;justify-content:space-between;
 align-items:center
}
.logo{font-weight:bold;color:#a78bfa;font-size:19px}
.status{color:#5ee6ae;font-size:11px}
.container{max-width:950px;margin:auto;padding:20px}
.hero{
 padding:28px 20px;border-radius:18px;
 background:linear-gradient(135deg,#251b50,#111b35);
 margin-bottom:22px
}
h1{font-size:27px;margin:0 0 10px}
p{color:#aaaec5;line-height:1.5}
input{
 width:100%;padding:14px;margin:7px 0;
 background:#171b2d;border:1px solid #343a58;
 color:white;border-radius:9px;font-size:15px
}
button{
 border:0;border-radius:9px;padding:13px 18px;
 background:#7655e8;color:white;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.6}
.full{width:100%;margin-top:8px}
.section{margin-top:25px}
.section h2{font-size:20px}
.tools{display:flex;gap:9px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px}
.tools select{
 padding:12px;background:#171b2d;
 border:1px solid #343a58;color:white;
 border-radius:9px
}
.grid{
 display:grid;grid-template-columns:
 repeat(auto-fill,minmax(145px,1fr));gap:13px
}
.card{
 background:#15192a;border:1px solid #292e47;
 border-radius:12px;overflow:hidden
}
.card img{
 width:100%;height:145px;object-fit:cover;
 background:#252a40
}
.card-info{padding:11px}
.card h3{font-size:14px;margin:0 0 7px}
.card small{color:#a99af2}
.message{
 padding:15px;background:#171b2d;
 border-radius:10px;color:#b9b9ce;
 margin-top:12px;font-size:13px
}
footer{
 text-align:center;padding:30px 15px;
 color:#777d96;font-size:12px
}
</style>
</head>
<body>
<header>
 <div class="logo">JARVISH SKIN</div>
 <div class="status">● SYSTEM ONLINE</div>
</header>

<main class="container">
 <section class="hero">
  <h1>MLBB Skin Checker</h1>
  <p>Explore Mobile Legends heroes and skin catalog.</p>
  <b>Account Checker</b>
  <input id="uid" placeholder="Masukkan User ID">
  <input id="zone" placeholder="Masukkan Zone ID">
  <button class="full" onclick="checkAccount()">
   CHECK MY SKINS
  </button>
  <div id="accountResult"></div>
 </section>

 <section class="section">
  <h2>Skin Catalog</h2>
  <p>Temukan hero dan koleksi Mobile Legends.</p>
  <div class="tools">
   <input id="search" placeholder="Cari hero..."
    oninput="renderHeroes()">
   <select id="category" onchange="renderHeroes()">
    <option value="all">Semua Hero</option>
   </select>
  </div>
  <div id="status" class="message">
   Menghubungkan ke database...
  </div>
  <div id="heroes" class="grid"></div>
 </section>
</main>

<footer>
 Jarvish MLBB Skin Checker<br>
 Fan-made project. Not affiliated with Moonton.
</footer>

<script>
const API = "https://mlbbdex.com/api/v1/heroes";
let heroData = [];

async function loadHeroes(){
 const status = document.getElementById("status");
 status.textContent = "Mengambil data hero...";

 try{
  const response = await fetch(API);
  if(!response.ok) throw new Error("API error");
  const json = await response.json();

  heroData = Array.isArray(json) ? json :
   (json.data || json.heroes || []);

  if(!heroData.length) throw new Error("Data kosong");

  status.textContent =
   "Berhasil memuat " + heroData.length + " hero.";
  renderHeroes();

 }catch(error){
  status.textContent =
   "Katalog belum dapat dimuat. Periksa koneksi atau dokumentasi API.";
  console.error(error);
 }
}

function renderHeroes(){
 const search = document.getElementById("search")
  .value.toLowerCase();
 const category = document.getElementById("category").value;
 const container = document.getElementById("heroes");

 const filtered = heroData.filter(hero=>{
  const name = (hero.name || hero.hero_name || "").toLowerCase();
  const role = hero.role || "";
  return name.includes(search) &&
   (category === "all" || role === category);
 });

 container.innerHTML = "";

 filtered.forEach(hero=>{
  const name = hero.name || hero.hero_name || "Hero";
  const image = hero.image || hero.image_url ||
   hero.portrait || "";
  const role = hero.role || "MLBB Hero";

  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = image;
  img.alt = name;
  img.onerror = ()=>{img.style.display="none"};

  const info = document.createElement("div");
  info.className = "card-info";

  const title = document.createElement("h3");
  title.textContent = name;

  const label = document.createElement("small");
  label.textContent = role;

  info.append(title,label);
  card.append(img,info);
  container.append(card);
 });
}

async function checkAccount(){
 const uid = document.getElementById("uid").value.trim();
 const zone = document.getElementById("zone").value.trim();
 const result = document.getElementById("accountResult");

 if(!uid || !zone){
  result.textContent = "Masukkan User ID dan Zone ID.";
  return;
 }

 result.className = "message";
 result.textContent =
  "Fitur inventaris belum aktif. Website masih membutuhkan API resmi atau penyedia API yang sah untuk membaca kepemilikan skin. Tidak ada hasil kepemilikan yang dibuat-buat.";
}

loadHeroes();
</script>
</body>
</html>
